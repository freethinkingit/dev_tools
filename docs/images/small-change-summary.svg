<text x="38" y="151" fill="#a6e3a1" xml:space="preserve">-back-without-ticket/prompt.md (new)</text>
<text x="20" y="171" fill="#a6e3a1" xml:space="preserve">  - </text>
<text x="38" y="191" fill="#a6e3a1" xml:space="preserve">~/.superset/worktrees/developer-handbook/0k-consolidated-p-ugin-dc0007c4/evals/skills/bugfix/reads</text>
<text x="38" y="211" fill="#a6e3a1" xml:space="preserve">-back-without-ticket/graders/states-symptom.md (new)</text>
<text x="20" y="231" fill="#a6e3a1" xml:space="preserve">  - </text>
<text x="38" y="251" fill="#a6e3a1" xml:space="preserve">~/.superset/worktrees/developer-handbook/0k-consolidated-p-ugin-dc0007c4/evals/skills/bugfix/reads</text>
