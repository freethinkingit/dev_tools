<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
<text x="470" y="23" fill="#8a8aa0" text-anchor="middle" xml:space="preserve">ponderly — start-task</text>
<text x="20" y="71" fill="#a6e3a1" xml:space="preserve">⏺ status: done</text>
<text x="20" y="91" fill="#a6e3a1" xml:space="preserve">  files changed:</text>
