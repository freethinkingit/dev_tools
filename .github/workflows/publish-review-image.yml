name: Publish review image

# Builds the ReviewBench image of benchmarks/reviewbench/Dockerfile and pushes it
# to GitHub Container Registry. Run by hand from the Actions tab only; the digest
# in the run summary goes into benchmarks/reviewbench/ponderly.json.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ponderly-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/reviewbench/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sabind/ponderly-review:${{ github.sha }}

      - name: Write the digest to the summary
        run: echo "ghcr.io/sabind/ponderly-review@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
